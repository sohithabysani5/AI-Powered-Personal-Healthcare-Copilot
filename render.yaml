services:
  - type: web
    name: health-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: AI_PROVIDER_ORDER
        value: gemini,mistral,grok
      - key: GEMINI_API_KEY
        sync: false

