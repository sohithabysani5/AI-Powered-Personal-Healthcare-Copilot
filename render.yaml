services:
  - type: web
    name: health-copilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /healthz
    # Note: On Render Free tier, persistent disks are not supported.
    # To enable persistent storage on Render, change 'plan: starter' and uncomment the disk block:
    # disk:
    #   name: health-copilot-files
    #   mountPath: /var/data
    #   sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: ALLOWED_ORIGINS
        fromService:
          type: static
          name: health-copilot-frontend
          property: host
      - key: AI_PROVIDER_ORDER
        value: gemini,mistral,grok
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: health-copilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: health-copilot-api
          property: host
